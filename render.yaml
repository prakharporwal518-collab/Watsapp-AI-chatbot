# Render Blueprint: New → Blueprint → select this repo. Fill the "sync: false" secrets in the dashboard.
services:
  - type: web
    name: whatsapp-ai-tutor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: tutor-db
          property: connectionString
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_REMINDER_TEMPLATE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: IDENTIFIER_HASH_SECRET
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false

databases:
  - name: tutor-db
    plan: free
